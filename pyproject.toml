[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipldt"
dynamic = ["version"]
description = "Open-source reimplementation of the Scanco IPL HR-pQCT bone morphometry evaluation (compartment separation, contour rendering, Laplace-Hamming segmentation, cortical pores, /dt_thickness, /dt_spacing, /dt_number), validated voxel for voxel against IPL; with ORMIR-BQRL, the workflow built on it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bone Quality Research Lab (Kazakia Lab), UCSF" }]
keywords = ["HR-pQCT", "Scanco", "IPL", "trabecular thickness", "trabecular spacing", "distance transform", "sphere fitting", "bone", "morphometry", "ORMIR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
]

[project.optional-dependencies]
# CuPy for the ridge test and the sphere drawing (results identical to the CPU path).
# The [ctk] extra pulls the CUDA runtime libraries from PyPI so no system CUDA install is needed.
gpu = ["cupy-cuda12x[ctk]"]
# Scanco AIM element size via ITK's Scanco IO module, NIfTI export via SimpleITK.
io = ["itk", "itk-ioscanco", "SimpleITK"]
# The surrounding pipeline (autocontour, BMD, file_reader) - https://github.com/ORMIRcommunity/ormir-xct
# (ormir-xct itself needs Python >= 3.11).
ormir = ["ormir-xct"]
test = ["pytest>=7"]
# ORMIR-BQRL, the workflow (ormir_bqrl: pipeline, Slicer interchange, redo, preview) on top of [io] + [ormir].
bqrl = ["ipldt[io,ormir]", "matplotlib>=3.7"]
# The validation harness and the paper's figure / table scripts (validation/, manuscript/).
paper = ["matplotlib>=3.7", "pandas", "psutil"]
all = ["ipldt[gpu,io,ormir,test,bqrl,paper]"]

[project.urls]
Homepage = "https://github.com/zhuyihua1234/ipldt"
"ORMIR-XCT" = "https://github.com/ORMIRcommunity/ormir-xct"

# Command-line workflows in the style of ormir_xct.workflows (need the [io] extra; the pipeline
# entry also needs [ormir]).  Run `ipldt-dt-thickness --help` etc. after `pip install -e .[io]`;
# `--version` prints the ipldt version (IPL's own -version option of the dt_* commands is --dt-version).
[project.scripts]
ipldt-pipeline = "ipldt.workflows.ipl_pipeline_workflow:main"
ipldt-dt-thickness = "ipldt.workflows.dt_thickness_workflow:main"
ipldt-dt-spacing = "ipldt.workflows.dt_spacing_workflow:main"
ipldt-dt-number = "ipldt.workflows.dt_number_workflow:main"
ipldt-ipl-morphometry = "ipldt.workflows.ipl_morphometry_workflow:main"
# ORMIR-BQRL, the workflow: run | redo | slicer-export | batch | params | version (needs the [bqrl] extra).
ormir-bqrl = "ormir_bqrl.cli:main"

[tool.setuptools.packages.find]
include = ["ipldt*", "ormir_bqrl*"]
exclude = ["tests*", "validation*", "manuscript*", "tools*"]

[tool.setuptools.dynamic]
version = { attr = "ipldt.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: validation against IPL's exported products of real scans (non-public data: set IPLDT_LAB_ROOT or IPLDT_DATA_ROOT; deselect with -m 'not slow')",
    "gpu: needs CuPy and a CUDA device (skipped automatically otherwise)",
]
filterwarnings = [
    "ignore:CUDA path could not be detected:UserWarning",
    # SimpleITK's SWIG bindings emit hundreds of these on import under Python 3.12
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:.*SwigPy.*:DeprecationWarning",
]
